name: paysync

x-node-service: &node-service
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  stop_grace_period: 30s
  networks: [internal]

x-db-env: &db-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_PASSWORD_FILE: /run/secrets/db_password

services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
      PAYSYNC_DB_NAME: paysync
    secrets:
      - postgres_superuser_password
      - db_migrator_password
      - db_app_password
      - db_readonly_password
    configs:
      - source: postgresql_conf
        target: /etc/postgresql/postgresql.conf
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paysync -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s
    networks: [internal]

  migrate:
    <<: *node-service
    build: { context: ., target: migrate }
    image: paysync/migrate:${IMAGE_TAG:-local}
    restart: "no"
    environment:
      <<: *db-env
      DATABASE_URL: postgres://paysync_migrator@db:5432/paysync
    secrets:
      - source: db_migrator_password
        target: db_password
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256m }

  api:
    <<: *node-service
    build: { context: ., target: api }
    image: paysync/api:${IMAGE_TAG:-local}
    environment:
      <<: *db-env
      DATABASE_URL: postgres://paysync_app@db:5432/paysync
      DB_POOL_MAX: ${API_DB_POOL_MAX:-10}
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      API_DOCS: ${API_DOCS:-off}
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      CALLBACK_PATH_SECRET_FILE: /run/secrets/callback_path_secret
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      DARAJA_ENV: sandbox
      CALLBACK_ALLOWED_IPS: ${CALLBACK_ALLOWED_IPS:-}
      NODE_OPTIONS: --max-old-space-size=384
    secrets:
      - source: db_app_password
        target: db_password
      - better_auth_secret
      - callback_path_secret
      - data_encryption_key
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal, edge]
    deploy:
      resources:
        limits: { memory: 512m }

  worker:
    <<: *node-service
    build: { context: ., target: worker }
    image: paysync/worker:${IMAGE_TAG:-local}
    environment:
      <<: *db-env
      DATABASE_URL: postgres://paysync_app@db:5432/paysync
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-10}
      HEALTH_PORT: 3001
      NODE_OPTIONS: --max-old-space-size=384
      DARAJA_ENV: sandbox
      DARAJA_CONSUMER_KEY_FILE: /run/secrets/daraja_consumer_key
      DARAJA_CONSUMER_SECRET_FILE: /run/secrets/daraja_consumer_secret
      DARAJA_PASSKEY_FILE: /run/secrets/daraja_passkey
      DARAJA_INITIATOR_NAME: ${DARAJA_INITIATOR_NAME:-}
      DARAJA_INITIATOR_PASSWORD_FILE: /run/secrets/daraja_initiator_password
      CALLBACK_PATH_SECRET_FILE: /run/secrets/callback_path_secret
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-}
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
    secrets:
      - source: db_app_password
        target: db_password
      - daraja_consumer_key
      - daraja_consumer_secret
      - daraja_passkey
      - daraja_initiator_password
      - callback_path_secret
      - data_encryption_key
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # The only long-running service that calls Daraja.
    networks: [internal, egress]
    deploy:
      resources:
        limits: { memory: 512m }

  web:
    build: { context: ., target: web }
    image: paysync/web:${IMAGE_TAG:-local}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [edge]
    deploy:
      resources:
        limits: { memory: 64m }

  proxy:
    build: { context: ., target: proxy }
    image: paysync/proxy:${IMAGE_TAG:-local}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    networks: [edge]
    deploy:
      resources:
        limits: { memory: 128m }

  daraja:
    # Sandbox operator CLI: `make daraja ARGS="stk-query --checkout ws_CO_..."`, `make simulate`.
    <<: *node-service
    image: paysync/api:${IMAGE_TAG:-local}
    profiles: [tools]
    restart: "no"
    entrypoint: ["node", "--enable-source-maps", "dist/daraja-cli.js"]
    environment:
      <<: *db-env
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://paysync_app@db:5432/paysync
      DARAJA_CONSUMER_KEY_FILE: /run/secrets/daraja_consumer_key
      DARAJA_CONSUMER_SECRET_FILE: /run/secrets/daraja_consumer_secret
      DARAJA_PASSKEY_FILE: /run/secrets/daraja_passkey
      CALLBACK_PATH_SECRET_FILE: /run/secrets/callback_path_secret
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      DARAJA_SHORTCODE: ${DARAJA_SHORTCODE:-174379}
      DARAJA_C2B_SHORTCODE: ${DARAJA_C2B_SHORTCODE:-600984}
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL:-}
      API_INTERNAL_URL: http://api:3000
    secrets:
      - source: db_app_password
        target: db_password
      - daraja_consumer_key
      - daraja_consumer_secret
      - daraja_passkey
      - callback_path_secret
      - data_encryption_key
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, edge, egress]

  tunnel:
    # Public URL for sandbox callbacks only. Never used in production.
    image: ngrok/ngrok:3.39.11-alpine@sha256:187e588f6c4efe3b29cd3eea9fcd768a1afa7342319e3cee9aeb5af6a9cf64fd
    profiles: [tunnel]
    entrypoint: ["sh", "-c", "NGROK_AUTHTOKEN=\"$$(cat /run/secrets/ngrok_authtoken)\" exec ngrok http proxy:8080 --web-addr 0.0.0.0:4040 --log stdout --log-format json"]
    secrets:
      - ngrok_authtoken
    ports:
      - "127.0.0.1:${NGROK_INSPECT_PORT:-4040}:4040"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      proxy: { condition: service_healthy }
    networks: [edge, egress]

  psql:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    profiles: [tools]
    entrypoint: ["sh", "-c", "PGPASSWORD=\"$$(cat /run/secrets/postgres_superuser_password)\" exec psql -h db -U postgres -d paysync"]
    secrets:
      - postgres_superuser_password
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

networks:
  internal:
    internal: true
  edge: {}
  # Outbound internet for Daraja and the tunnel only.
  egress: {}

volumes:
  db-data: {}

configs:
  postgresql_conf:
    file: ./docker/postgres/postgresql.conf

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  db_migrator_password:
    file: ./secrets/db_migrator_password
  db_app_password:
    file: ./secrets/db_app_password
  db_readonly_password:
    file: ./secrets/db_readonly_password
  better_auth_secret:
    file: ./secrets/better_auth_secret
  callback_path_secret:
    file: ./secrets/callback_path_secret
  data_encryption_key:
    file: ./secrets/data_encryption_key
  daraja_consumer_key:
    file: ./secrets/daraja_consumer_key
  daraja_consumer_secret:
    file: ./secrets/daraja_consumer_secret
  daraja_passkey:
    file: ./secrets/daraja_passkey
  daraja_initiator_password:
    file: ./secrets/daraja_initiator_password
  ngrok_authtoken:
    file: ./secrets/ngrok_authtoken
