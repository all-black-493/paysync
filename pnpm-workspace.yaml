packages:
  - apps/*
  - packages/*

savePrefix: ''

allowBuilds:
  # The postinstall only checks the platform binary, which pnpm installs as an optional dependency.
  esbuild: false
  # Only used for image optimization, which the static export disables.
  sharp: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.101'
  - '@ai-sdk/provider-utils@5.0.52'
  - '@ai-sdk/provider@4.0.20'
  - ai@7.0.123
