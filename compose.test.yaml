name: paysync-test

services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
      PAYSYNC_DB_NAME: paysync_template
    secrets:
      - postgres_superuser_password
      - db_migrator_password
      - db_app_password
      - db_readonly_password
    configs:
      - source: postgresql_conf
        target: /etc/postgresql/postgresql.conf
    tmpfs:
      - /var/lib/postgresql:size=1g
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paysync_template -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
    shm_size: 256mb

  migrate:
    build: { context: ., target: migrate }
    image: paysync/migrate:${IMAGE_TAG:-local}
    init: true
    read_only: true
    environment:
      NODE_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgres://paysync_migrator@db:5432/paysync_template
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: db_migrator_password
        target: db_password
    depends_on:
      db: { condition: service_healthy }

  test:
    build: { context: ., target: dev }
    image: paysync/dev:${IMAGE_TAG:-local}
    init: true
    environment:
      NODE_ENV: test
      TEST_ADMIN_DATABASE_URL: postgres://postgres@db:5432/postgres
      TEST_ADMIN_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      TEST_APP_PASSWORD_FILE: /run/secrets/db_app_password
      TEST_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      TEST_TEMPLATE_DATABASE: paysync_template
    secrets:
      - postgres_superuser_password
      - db_migrator_password
      - db_app_password
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

configs:
  postgresql_conf:
    file: ./docker/postgres/postgresql.conf

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  db_migrator_password:
    file: ./secrets/db_migrator_password
  db_app_password:
    file: ./secrets/db_app_password
  db_readonly_password:
    file: ./secrets/db_readonly_password
