name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Unit + integration tests (Postgres 18 in Docker)
        run: make test

      - name: Runtime images are non-root with no dev dependencies
        run: make verify-images

      - name: Smoke test the production-shaped stack
        run: make smoke

      - name: Vulnerability scan (fail on fixable CRITICAL)
        run: make scan

      - name: SBOM
        run: make sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
